# Cloudflare Workers + static assets + D1 (SQLite).
# This is the current Workers / Pages unified deploy path.
# After `wrangler login`, create the remote DB and paste its id below:
#   npx wrangler d1 create cursor-ultra-notes
#
# Local development uses the same schema via `wrangler d1` (local SQLite).
# A real Cloudflare database_id is only required for --remote migrate/deploy.

name = "cursor-ultra-notes"
main = "src/index.tsx"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cursor-ultra-notes"
# Placeholder UUID — works for local D1. Replace after `wrangler d1 create`.
database_id = "00000000-0000-4000-8000-000000000001"
migrations_dir = "migrations"

[observability]
enabled = true
head_sampling_rate = 1

[vars]
SITE_TITLE = "Cursor Ultra Build Notes"
SITE_OWNER = "Sani Verma"
SITE_OWNER_GITHUB = "sanikantv"
