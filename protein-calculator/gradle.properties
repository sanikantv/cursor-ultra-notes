org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# AGP 9 defaults to a new DSL and built-in Kotlin. The classic Kotlin Android
# plugin and Hilt are applied with the compatible opt-out until those plugins
# are used through the new DSL only.
android.builtInKotlin=false
android.newDsl=false
